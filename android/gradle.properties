# Capped for this 3.7 GB machine (template default of 8G cannot be honored).
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=640m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx768m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template.
# true = AGP 9 compiles Kotlin natively; plugins (home_widget, flutter_timezone)
# already gate their legacy KGP apply on this flag, so no plugin applies KGP.
# The Flutter CLI still prints its KGP warning (static scan doesn't understand
# the plugins' Groovy conditionals) — false positive, build is clean.
android.builtInKotlin=true
