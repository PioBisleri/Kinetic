// Vendored from pedometer 4.2.0 (https://pub.dev/packages/pedometer) and
// patched 2026-10 for Android Gradle Plugin 9:
//   * removed the `kotlin-android` plugin apply — Kotlin is built into
//     AGP 9+ and applying it is a hard error
//   * modernized the android DSL (`compileSdk`, `lint`, no `kotlinOptions`,
//     no buildscript classpath block) — the old APIs were removed in AGP 9
// Source of truth upstream: cph-cachet/flutter-plugins. Re-apply these
// edits if the vendored copy is ever refreshed from upstream.
group 'com.example.pedometer'
version '4.2.0'

apply plugin: 'com.android.library'

android {
    namespace "com.example.pedometer"
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdk 21
    }
    lint {
        disable 'InvalidPackage'
    }
}
